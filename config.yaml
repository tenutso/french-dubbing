# French Dubbing Pipeline v1.0 — Configuration
# Place at /workspace/config.yaml

# ============================================================
# Paths  (created automatically by setup.sh)
# ============================================================
pipeline:
  input_folder:  /workspace/videos/input
  output_folder: /workspace/outputs
  models_folder: /workspace/models
  logs_folder:   /workspace/logs
  temp_folder:   /workspace/temp

# ============================================================
# Audio
# ============================================================
audio:
  # Source audio extraction rate (whisper/demucs/diarization input).
  # TTS output is independent: XTTS-v2 produces 24 kHz, upsampled at assembly.
  synthesis_sample_rate: 48000
  # Vimeo accepts both 44100 and 48000 Hz; 48000 avoids resampling loss
  output_sample_rate: 48000
  # Boost the final output by this percent (0 = off, 20 = +20%). Applied after
  # peak normalization; hard-clipped at ±1.0. Override at runtime: --volume-boost 20
  volume_boost_pct: 0

# ============================================================
# Final output — muxed video
# ============================================================
output:
  # Also emit a ready-to-watch {name}_french.mp4 (original video + dubbed audio
  # + subtitles), so sync is verifiable in a single file. The dubbed audio is
  # held to the source length (anchored timing), so video and audio end together.
  mux_video: true
  # false = soft-embed the SRT as a selectable track and copy the video stream
  #         (fast, no quality loss).
  # true  = burn the subtitles into the picture (re-encodes the video).
  burn_subs: false

# ============================================================
# Speaker Diarization — pyannote.audio (optional)
# Detects who is speaking when and builds a separate voice-clone
# reference for each speaker, so every voice is dubbed distinctly.
# Requires: pip install pyannote.audio
# The HF token (translation.huggingface_token or $HF_TOKEN) must
# have accepted the model license:
#   https://huggingface.co/pyannote/speaker-diarization-community-1
# ============================================================
diarization:
  enabled: true
  model: pyannote/speaker-diarization-community-1
  # Set both to the same number to force an exact speaker count.
  min_speakers: 2
  max_speakers: 10
  # Seconds of each speaker's audio to assemble for their voice clone.
  profile_duration: 25

# ============================================================
# Source Separation — Demucs
# Separates speaker vocals from background music/noise before
# transcription and voice cloning.
# ============================================================
source_separation:
  enabled: true
  # htdemucs    → best quality (hybrid transformer, recommended)
  # htdemucs_ft → fine-tuned variant, slightly slower
  # mdx_extra   → lighter, good balance of speed and quality
  model: htdemucs
  # Re-mix the original background track (music, ambience) back with the
  # French dubbed vocals into a separate *_french_full.m4a output.
  preserve_background: true

# ============================================================
# Transcription — faster-whisper (CTranslate2)
# ============================================================
whisper:
  model: large-v3
  language: en
  device: cuda
  # float16       → best quality on RTX 4090
  # int8_float16  → lower VRAM, marginal accuracy loss
  compute_type: float16
  # Anti-hallucination tuning. condition_on_previous_text=false prevents
  # Whisper from feeding (potentially looped) prior output as context for
  # the next window — the single biggest switch against runaway repetition.
  condition_on_previous_text: false
  # Reject segments that are too compressible (a classic loop signature
  # like "X. X. X."). Lower = more aggressive. Default fw value is 2.4.
  compression_ratio_threshold: 2.2
  # Drop windows whose no-speech probability exceeds this.
  no_speech_threshold: 0.6
  # Average log-prob floor; segments below get dropped.
  log_prob_threshold: -1.0

# ============================================================
# Translation — Qwen3 via Ollama
# Single backend, single natural pass + targeted compression. Overflow is
# handled downstream by the assembler's timing policy (no_drop) rather than by
# shrinking translations — see tts.timing_policy / reading_cps below.
# ============================================================
translation:
  # Qwen3:14b via Ollama. /no_think is sent automatically for qwen3.* tags.
  model: qwen3:14b
  temperature: 0.3
  # 20 segments per Ollama call. Bigger batches save calls but risk hitting
  # the 4096-token output budget if segments are long.
  batch_size: 20
  # Optional self-review pass — Qwen rereads its own output and fixes
  # Anglicisms / register slips. Roughly doubles translation time.
  review_pass: true
  # Targeted compression pass — after the main translation, re-prompt only
  # the segments still over budget_cps with a tighter "rewrite shorter,
  # preserve meaning" brief. Cheap (operates on a minority of segments) and
  # eliminates most remaining stretched/truncated audio.
  compression_pass: true
  # Max iterative compression rounds. Each round re-prompts only the segments
  # still over budget, compressing against their latest text, until they fit or
  # no further progress is made. More rounds = tighter fit, slightly more calls.
  compression_rounds: 3
  # Character budget per second of audio that Qwen is asked to fit each segment
  # into. Matched to assembler reading_cps (16) so the LLM is not asked to
  # over-compress below what the timing policy already tolerates — extra tightness
  # below reading_cps just strips meaning without improving sync. Keep ≤
  # subtitles.max_cps / reading_cps. Lower (e.g. 15) = tighter French, more drift risk.
  budget_cps: 16
  # Target syllables-per-second ceiling, used as a SECOND over-budget gate
  # alongside budget_cps in the compression pass. French syllable count tracks
  # speaking time better than raw characters, so a segment that is dense by either
  # chars/sec or syllables/sec gets a compression attempt. ~6 syl/s is a
  # comfortable spoken-French dubbing pace; lower = more aggressive compression.
  target_sps: 6.0
  # Write one per-segment metrics CSV per stage into the video's output_dir
  # ({name}_metrics_<stage>.csv) with EN/FR chars, expansion %, target/actual CPS,
  # syllable rate and density ratio — for offline tuning of budget_cps/target_sps.
  metrics_csv: true

  # Target language for the dub. Drives the prompt language label.
  # Supported: fr, es, de, it, pt, nl, pl, ru, ja, ko, zh, ar, tr, hi, vi.
  target_lang: fr

  # Locale variant.
  # "fr"    → standard European French (default, no glossary applied)
  # "fr-ca" → Canadian / Québécois French — loads canadian_glossary.yaml
  #           and applies prompt injection + 'always'-mode substitution.
  # Override at runtime with: --locale fr-ca
  locale: fr-ca
  glossary_path: /workspace/canadian_glossary.yaml

  # HuggingFace token — only used by the diarization gated model.
  # Leave blank to read from the HF_TOKEN environment variable instead.
  huggingface_token: ""

# ============================================================
# Text-to-Speech
# The engine runs out-of-process in its own venv (/workspace/venvs/<engine>),
# so each engine's dependencies stay isolated. Add a new engine by dropping a
# tts/engines/<name>.py adapter + requirements-<name>.txt — no pipeline edits.
# ============================================================
tts:
  # Adapter name in tts/engines/. "xtts" (default) reads the xtts_* keys below.
  engine: f5_tts  # xtts | chatterbox | elevenlabs | f5_tts | google_tts | <your-adapter>
  # Opaque, engine-specific knobs handed verbatim to the adapter. Ignored by
  # xtts (which uses the xtts_* keys). Examples per engine:
  #   chatterbox:  { exaggeration: 0.5, cfg_weight: 0.5, temperature: 0.8 }
  #   elevenlabs:  { model_id: eleven_multilingual_v2, stability: 0.5,
  #                  similarity_boost: 0.75, style: 0.0, use_speaker_boost: true }
  #                # API key comes from the ELEVENLABS_API_KEY env var (preferred)
  #                # — do NOT put it here. Set voice_id to reuse a pre-made voice
  #                # instead of cloning the reference clip on the fly.
  #   f5_tts:      { model: F5TTS_v1_Base, ref_text: "", remove_silence: false }
  #   google_tts:  { voice_name: fr-CA-Neural2-A, api_key: GOOGLE_TTS_API_KEY }
  #                # Google Cloud TTS (Neural2/WaveNet/Studio). Cloud API, fixed
  #                # voice — does NOT clone the speaker. voice_name picks language +
  #                # tier (…-Neural2-…, …-Wavenet-…, …-Studio-…). api_key is the env
  #                # var NAME holding the key; or use credentials_path for a
  #                # service-account JSON. See tts/engines/google_tts.py.
  #
  # f5_tts + French: the stock F5TTS_v1_Base checkpoint is English/Chinese only,
  # so French text comes out mispronounced. Point it at a French fine-tune via
  # hf_repo (auto-downloaded + pre-cached by setup) and set `model` to the
  # fine-tune's architecture. To revert to the English base, set engine_params: {}.
  # `ckpt_file`/`vocab_file` (local paths) override hf_repo if you have weights on disk.
  engine_params:
    model: F5TTS_Base        # RASPIAUDIO fine-tune is the v0 architecture, NOT v1
    hf_repo: RASPIAUDIO/F5-French-MixedSpeakers-reduced
    hf_ckpt_file: model_last_reduced.pt
    hf_vocab_file: vocab.txt
    ref_text: ""
    remove_silence: false

  # ── XTTS-v2 (Coqui / Idiap fork) settings — used when engine: xtts ──────────
  # Multilingual zero-shot voice cloning, 24 kHz native output, native FR support.
  xtts_model: tts_models/multilingual/multi-dataset/xtts_v2
  # XTTS sampling. 0.65 is a stable default; lower = more monotone.
  xtts_temperature: 0.65
  xtts_repetition_penalty: 2.0
  xtts_length_penalty: 1.0
  xtts_top_k: 50
  xtts_top_p: 0.85

  # Speaker reference clip for voice cloning.
  speaker_profile_duration: 25
  # Skip this many seconds from the start (avoids intro music / titles).
  speaker_profile_skip: 20

  # DeepFilterNet denoising on the speaker reference clip.
  use_deepfilter: true

  # Per-group speed-up cap. In timing_policy=anchored this is how much a dense
  # run may be sped up to stay inside the source timeline (1.30 ≈ inaudible on
  # speech). Keep it gentle for naturalness.
  max_stretch: 1.3
  min_stretch: 0.7

  # Timing policy when a dub run is longer than its time window:
  #   anchored → hold the source timeline: speed dense runs up (≤ max_stretch)
  #              and re-anchor drift at each pause, so the dub stays in sync with
  #              the video over a full-length program. Recommended.
  #   no_drop  → never speed up; extend the timeline so no words are lost. On a
  #              dense 1-hour talk the audio/subs drift progressively LONGER than
  #              the video — this is the cause of end-of-video desync.
  #   lock     → keep exact source timing; speed up to max_stretch then
  #              hard-truncate the overflowing tail (legacy behaviour).
  timing_policy: anchored

  # Reading-speed coupling: a speech run whose translated text is denser than
  # reading_cps chars/sec is slowed toward that pace so the dub AND the subtitles
  # timed to it read comfortably. In anchored mode the slow-down only uses spare
  # room in the window (never pushes past the slot); capped at max_slowdown.
  reading_cps: 16.0
  max_slowdown: 1.25

  # Grouped tempo smoothing: consecutive segments separated by <= this many
  # seconds of original silence share one uniform stretch ratio, so
  # speed-ups/slow-downs are spread evenly across a speech run instead of
  # falling on a single overflowing segment. Larger values = smoother but
  # may stretch over short natural pauses; smaller = more local. 0 disables
  # grouping (each segment treated independently).
  group_gap: 0.4

  # Time-stretch engine. "rubberband" preserves formants and sounds more
  # natural at moderate ratios; "atempo" is the legacy ffmpeg filter and
  # is used as a fallback when rubberband isn't available.
  stretcher: rubberband

  # Merge consecutive Whisper fragments into sentence-scale chunks before TTS.
  # Sub-second fragments cause robotic prosody and unreadable subtitles;
  # 2–12 s chunks give the TTS context and keep subtitles readable.
  segment_merge_gap: 1.5
  segment_merge_max_duration: 12.0
  segment_merge_min_duration: 2.0

  # CPS guard — translated segments whose French exceeds this CPS get split
  # at a sentence boundary before TTS. Shorter halves are more stable for
  # XTTS and the assembler can stretch each half independently. 0 disables.
  cps_split_threshold: 21.0

# ============================================================
# Subtitles
# ============================================================
subtitles:
  format: srt
  encoding: utf-8
  # Shift all subtitles N ms (positive = later, negative = earlier).
  sync_offset_ms: 0

  # Subtitle shaping standard:
  #   netflix → ≤42 chars/line, ≤2 lines, 0.833-7s, reading speed ≤17 CPS
  #   bbc     → ≤37 chars/line (stricter line length), otherwise similar
  #   kapwing → legacy karaoke single-line fragments (no reading-speed cap)
  standard: netflix
  max_chars_per_line: 42
  max_lines: 2
  max_cps: 17.0           # reading-speed cap (chars/second)
  min_duration: 0.833     # 5/6 s minimum cue duration
  max_duration: 7.0
  min_gap: 0.083          # ≥2 frames @24fps between cues
  # Fix #1 — max seconds a subtitle may lag its audio to earn reading time in
  # dense speech (it re-syncs at the next pause). 0 locks cues to the audio.
  max_lag: 3.0
  # Fix #2 — after #1, lightly LLM-shorten only the cues still above max_cps so
  # dense subtitles become readable while staying close to the spoken dub.
  # Adds a few minutes (Qwen passes over the over-speed cues). false disables.
  condense: true
  # Fix #2 iterations — how many LLM rounds to spend shortening cues still over
  # max_cps. Each round re-prompts only the remaining offenders against their
  # latest (shorter) text, mirroring the translation compression pass. 1 = the
  # old single-shot behaviour. Genuinely fast-source cues may never fully fit.
  condense_rounds: 3

# ============================================================
# Processing
# ============================================================
processing:
  max_workers: 1       # keep at 1 — models share 24 GB VRAM
  timeout_seconds: 7200
  # Set to true to skip temp-dir cleanup and dump intermediate segment JSON files.
  # Useful for inspecting what each pipeline stage produces (transcription, merge,
  # translation, etc.). Files land in temp_folder/<video-stem>/segments_NN_*.json.
  keep_temp: true
